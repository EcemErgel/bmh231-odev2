<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bozok Etkinlik: Kampüs Etkinlik Panosu</title>
  <link rel="stylesheet" href="/stil.css">
     <link rel="icon" href="data:,">
  <script src="/betik.js" defer></script>
</head>
<body>
  <header class="ust-bant">
    <div class="logo">Bozok Etkinlik</div>
    <nav>
      <a href="#etkinlikler">Etkinlikler</a>
      <a href="#oner">Etkinlik Öner</a>
    </nav>
  </header>

  <main>
    <section id="etkinlikler" aria-labelledby="liste-baslik">
      <h1 id="liste-baslik">Yaklaşan Etkinlikler</h1>

      <div class="arac-cubugu">
        <div class="filtreler" role="group" aria-label="Etkinlik türü filtresi">
          <button type="button" class="filtre-dugme secili" data-tur="tumu">Tümü</button>
          <button type="button" class="filtre-dugme" data-tur="atolye">Atölye</button>
          <button type="button" class="filtre-dugme" data-tur="soylesi">Söyleşi</button>
          <button type="button" class="filtre-dugme" data-tur="topluluk">Topluluk</button>
        </div>

        <div class="arama">
          <label for="arama-kutusu">Etkinlik ara</label>
          <input type="search" id="arama-kutusu" placeholder="Başlıkta ara...">
        </div>
      </div>

      <p id="durum-mesaji" role="status" aria-live="polite"></p>
      <div id="etkinlik-listesi" class="kartlar"></div>
    </section>

    <section id="oner" aria-labelledby="oner-baslik">
      <h2 id="oner-baslik">Etkinlik Öner</h2>

      <form id="oneri-formu" novalidate>
        <div class="form-satir">
          <label for="oneri-ad">Etkinlik adı</label>
          <input type="text" id="oneri-ad" name="ad" autocomplete="off">
        </div>

        <div class="form-satir">
          <label for="oneri-tarih">Tarih</label>
          <input type="date" id="oneri-tarih" name="tarih">
        </div>

        <div class="form-satir">
          <label for="oneri-eposta">E-posta</label>
          <input type="email" id="oneri-eposta" name="eposta" autocomplete="email">
        </div>

        <button type="submit">Öneriyi Gönder</button>
        <p id="form-mesaji" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Bozok Etkinlik</p>
  </footer>
</body>
</html>
